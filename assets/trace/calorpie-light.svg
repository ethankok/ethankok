<svg xmlns="http://www.w3.org/2000/svg" width="860" height="82" viewBox="0 0 860 82" role="img" aria-label="Calorpie bot: snap_to_kcal()  photo, text or voice → calories">
  <style>
    .lbl { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .bar { fill: #F5C4B3; transform-box: fill-box; transform-origin: 0 50%; }
    .txt { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #712B13; white-space: pre; }
    .arr { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #712B13; }
    .dot{opacity:0}
    @media (prefers-reduced-motion: no-preference) {
      .bar { animation: grow 600ms cubic-bezier(.2,.7,.2,1) 300ms both; }
      .txt, .arr { animation: fade 300ms ease-out 900ms both; }
      .ic{opacity:.3}.arc{animation:sweep 2.1s ease-in-out infinite}.ic0{animation:ic0 6.3s linear infinite}.d0{animation:d0 6.3s ease-in-out infinite}.ic1{animation:ic1 6.3s linear infinite}.d1{animation:d1 6.3s ease-in-out infinite}.ic2{animation:ic2 6.3s linear infinite}.d2{animation:d2 6.3s ease-in-out infinite}
    }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
