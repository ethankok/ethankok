    @keyframes ic2{0.00%{opacity:.3}66.67%{opacity:.3}69.84%{opacity:1}96.83%{opacity:1}100.00%{opacity:.3}100.00%{opacity:.3}}
    @keyframes d2{0.00%{opacity:0;transform:translateX(0px)}71.43%{opacity:0;transform:translateX(0px)}72.38%{opacity:1;transform:translateX(0px)}80.16%{opacity:1;transform:translateX(38px)}80.95%{opacity:0;transform:translateX(38px)}100.00%{opacity:0;transform:translateX(0px)}}
