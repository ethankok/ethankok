<svg xmlns="http://www.w3.org/2000/svg" width="420" height="100" viewBox="0 0 420 100" role="img" aria-label="7.6% of HDB carparks at least 90% full right now">
  <style>
    .lbl { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .big { font: 700 46px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .spark { stroke-dasharray: 1; stroke-dashoffset: 0; }
    .dot { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .spark { animation: draw 1.6s ease-out 0.2s both; }
      .dot { animation: pop 0.4s ease-out 1.7s both; }
    }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <text class="lbl" x="16" y="24">HDB carparks &#8805;90% full right now</text>
  <text class="big" x="16" y="78">7.6%</text>
